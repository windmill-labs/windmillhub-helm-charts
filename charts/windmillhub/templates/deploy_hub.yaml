apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
# prettier-ignore
spec:
  replicas: 2
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: windmillhub
  template:
    metadata:
      labels:
        app: windmillhub
        container: hub
    spec:
    {{- with .Values.hub.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
      containers:
      - name: hub
        image: {{ .Values.hub.image }}:{{ default .Chart.AppVersion .Values.hub.tag }}
        imagePullPolicy: Always
        readinessProbe:
          initialDelaySeconds: 1
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
          httpGet:
            host:
            scheme: HTTP
            path: /ready
            port: 3000
        env:
        {{- with .Values.hub.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.hub.databaseUrlSecret.name }}
        - name: "DATABASE_URL"
          valueFrom:
            secretKeyRef:
              name: {{ .Values.hub.databaseUrlSecret.name | quote }}
              key: {{ .Values.hub.databaseUrlSecret.key | quote }}
        {{- else }}
        - name: "DATABASE_URL"
          value: {{ .Values.hub.databaseUrl }}
        {{- end }}
        {{- if not .Values.hub.privateHub }}
        - name: PUBLIC_PRIVATE_HUB
          value: "false"
        {{- end }}
        - name: PUBLIC_APP_URL
          value: {{ .Values.hub.appUrl }}
        {{- if .Values.hub.licenseKeySecret.name }}
        - name: "LICENSE_KEY"
          valueFrom:
            secretKeyRef:
              name: {{ .Values.hub.licenseKeySecret.name | quote }}
              key: {{ .Values.hub.licenseKeySecret.key | quote }}
        {{- else }}
        - name: "LICENSE_KEY"
          value: {{ .Values.hub.licenseKey }}
        {{- end }}
        {{- if .Values.hub.githubDispatchRepo }}
        - name: GITHUB_DISPATCH_REPO
          value: {{ .Values.hub.githubDispatchRepo | quote }}
        {{- end }}
        {{- if .Values.hub.githubDispatchTokenSecret.name }}
        - name: GITHUB_DISPATCH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.hub.githubDispatchTokenSecret.name | quote }}
              key: {{ .Values.hub.githubDispatchTokenSecret.key | quote }}
        {{- else if .Values.hub.githubDispatchToken }}
        - name: GITHUB_DISPATCH_TOKEN
          value: {{ .Values.hub.githubDispatchToken | quote }}
        {{- end }}
        ports:
        - containerPort: 3000
        resources:
          limits:
              memory: "2.5Gi"
              ephemeral-storage: "20Gi"
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: windmill-hub
spec:
  externalTrafficPolicy: Cluster
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: windmillhub
    container: hub
  sessionAffinity: ClientIP
  type: NodePort
status:
  loadBalancer: {}
